{% extends "base.html" %}
{% block title %}{{ group.name }} · Split{% endblock %}
{% block body %}
  <h1>{{ group.name }}</h1>
  {% if message %}<p class="message" role="alert">{{ message }}</p>{% endif %}
  <h2>Members</h2>
  <ul class="members">
    {% for m in group.members %}<li>{{ m }}</li>
    {% endfor %}
  </ul>
  <form method="post" action="/groups/{{ group.slug }}/members">
    <label>Add a member <input name="name" required></label>
    <button type="submit">Add</button>
  </form>
{% endblock %}
